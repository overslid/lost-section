<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <!-- Prosty styl CSS -->
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 20px;
            width: 88px;
        }

        /* Definicja animacji pulsowania fade'a */
        @keyframes pulseFade {
            0% {
                opacity: 0.25;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 0.25;
            }
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: #000000;
            position: relative;
            padding: 0 15px;
        }

        /* Efekt fade (poświata) po bokach CAŁEGO bloku z animacją pulsowania */
        .main-container::before,
        .main-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            z-index: 100;
            pointer-events: none;
            animation: pulseFade 4s ease-in-out infinite;
        }
        .main-container::before {
            left: -35px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(38, 73, 53, 0.8));
        }
        .main-container::after {
            right: -35px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(38, 73, 53, 0.8));
        }

        /* 1. Górny banner */
        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* 2. Czarny pasek z guzikami (Desktop - duży odstęp) */
        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        /* 2.5. Margines 40px */
        .margin-box {
            height: 40px;
            background-color: #000000;
        }

        /* 3. Główny design (1080x1080px) */
        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* 4. Mini galeria / Karuzela z wycentrowanym pierwszym zdjęciem i odsuniętymi strzałkami */
        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 65px; /* Odstęp ponad 50px od krańców bloku na strzałki */
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px 0;
            align-items: center;
            scrollbar-width: thin;
            scrollbar-color: #264935 #000000;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-track::-webkit-scrollbar {
            height: 10px;
            display: block !important;
        }

        .carousel-track::-webkit-scrollbar-track {
            background: #000000;
        }

        .carousel-track::-webkit-scrollbar-thumb {
            background: #264935;
            border-radius: 4px;
        }

        .carousel-item {
            flex: 0 0 100%; /* Jedno zdjęcie zajmuje całą szerokość widoku, kolejne po przescrollowaniu */
            height: 90%;
            aspect-ratio: 4 / 3;
            scroll-snap-align: center;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-item img {
            max-width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: none;
        }

        /* Strzałki w zielonym kolorze, odsunięte od krańców */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #264935; /* Nasz zielony kolor */
            border: 1px solid #264935;
            font-size: 28px;
            font-weight: bold;
            padding: 12px 10px;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .gallery-arrow:hover {
            background-color: #264935;
            color: #000000;
        }

        .gallery-arrow-left {
            left: 15px; /* Ponad 50px od krawędzi uwzględniając padding kontenera */
        }

        .gallery-arrow-right {
            right: 15px;
        }

        /* Pole na mikro-bannerki (automatyczne ładowanie) */
        .micro-banners-section {
            width: 100%;
            min-height: 160px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 10px;
        }

        .micro-banner-item img {
            height: 45px;
            width: auto;
            display: block;
            border: none;
        }

        /* 5. Grafika partners */
        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        /* 6. Grafika dolna */
        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        /* Lightbox (powiększenie bez obrysu) */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: none;
        }

        /* --- Media Queries dla wersji mobilnej --- */
        @media (max-width: 768px) {
            .main-container::before,
            .main-container::after {
                display: none;
            }

            .main-container {
                padding: 0;
            }

            /* Mniejszy margines na strzałki w mobile, żeby galeria była maksymalnie szeroka */
            .gallery-wrapper {
                padding: 0 35px;
            }

            .gallery-arrow {
                font-size: 20px;
                padding: 8px 6px;
            }

            /* Guziki pomniejszone o 10% i rozsunięte */
            .nav-bar a img {
                width: 54px;
                height: 23px;
            }

            .nav-bar {
                gap: 50px;
                height: 45px;
            }

            /* Mniejsze zdjęcia w galerii na mobile */
            .gallery-section {
                height: 260px;
            }

            /* Bannerki pomniejszone o 40% na mobile */
            .micro-banner-item img {
                height: 27px;
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="side-banners-left"></div>

    <div class="main-container">

        <!-- 1) Górny banner -->
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.jpg" alt="Lost Section Banner">
            </a>
        </div>

        <!-- 2) Pasek z guzikami -->
        <div class="nav-bar">
            <a href="https://www.lost-section.com/about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="https://www.lost-section.com/">
                <img src="images/button_home_ls.png" alt="Home">
            </a>
            <a href="/archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
        </div>

        <!-- 2.5) Margines 40px -->
        <div class="margin-box"></div>

        <!-- 3) Główny design (1080x1080) -->
        <div class="main-design">
            <img src="images/ls_design_main.jpg" alt="Main Design">
        </div>

        <!-- 4) Mini galeria dynamiczna -->
        <div class="gallery-wrapper">
            <div class="gallery-arrow gallery-arrow-left" onclick="scrollGallery(-1)">‹</div>
            <div class="gallery-section" id="gallerySection">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Zdjęcia ładowane automatycznie przez JavaScript -->
                </div>
            </div>
            <div class="gallery-arrow gallery-arrow-right" onclick="scrollGallery(1)">›</div>
        </div>

        <!-- Sekcja na mikro-bannerki (automatycznie ładowane) -->
        <div class="micro-banners-section" id="microBannersSection">
            <!-- Bannerki ładowane dynamicznie przez JavaScript -->
        </div>

        <!-- 5) Grafika Partners -->
        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <!-- 6) Stopka -->
        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full size">
    </div>

    <script>
        // 1. Automatyczne ładowanie zdjęć głównej galerii z folderu ls-gallery
        document.addEventListener("DOMContentLoaded", function() {
            const track = document.getElementById('carouselTrack');
            let i = 1;
            
            function checkNextImage() {
                const imgPath = `ls-gallery/${i}.jpg`;
                const img = new Image();
                img.src = imgPath;
                
                img.onload = function() {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'carousel-item';
                    itemDiv.innerHTML = `<img src="${imgPath}" alt="Galeria ${i}" onclick="openLightbox(this.src)">`;
                    track.appendChild(itemDiv);
                    
                    i++;
                    checkNextImage();
                };
                
                img.onerror = function() {
                    // Koniec zdjęć w galerii
                };
            }
            
            checkNextImage();

            // 2. Automatyczne ładowanie małych bannerków z folderu ls-blinkies (obsługuje .gif, .png, .jpg)
            const blinkiesContainer = document.getElementById('microBannersSection');
            let bIndex = 1;
            const extensions = ['gif', 'png', 'jpg', 'jpeg'];

            function tryLoadBlinkie(index, extList, extIdx) {
                if (extIdx >= extList.length) {
                    // Jeśli sprawdziliśmy wszystkie rozszerzenia dla danego indeksu i żaden nie istnieje, kończymy
                    return; 
                }

                const ext = extList[extIdx];
                const bannerPath = `ls-blinkies/banner${index}.${ext}`;
                const bImg = new Image();
                bImg.src = bannerPath;

                bImg.onload = function() {
                    const bannerDiv = document.createElement('div');
                    bannerDiv.className = 'micro-banner-item';
                    bannerDiv.innerHTML = `<img src="${bannerPath}" alt="Blinkie ${index}">`;
                    blinkiesContainer.appendChild(bannerDiv);

                    // Przejdź do szukania kolejnego bannera (np. banner2) z pierwszym rozszerzeniem
                    bIndex++;
                    tryLoadBlinkie(bIndex, extensions, 0);
                };

                bImg.onerror = function() {
                    // Spróbuj kolejnego rozszerzenia dla tego samego numeru
                    tryLoadBlinkie(index, extList, extIdx + 1);
                };
            }

            // Rozpocznij ładowanie bannerków od numeru 1
            tryLoadBlinkie(bIndex, extensions, 0);
        });

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function scrollGallery(direction) {
            const track = document.getElementById('carouselTrack');
            const itemWidth = track.clientWidth; // Przewijaj o szerokość dokładnie jednego widocznego elementu
            track.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }
    </script>

</body>
</html>
