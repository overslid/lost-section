<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com — in progress</title>
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            will-change: transform;
        }

        /* Minimalistyczny napis "IN PROGRESS..." w generycznym szeryfie (ok. 30px) */
        .in-progress-title {
            font-family: "Times New Roman", Times, "Baskerville", serif;
            font-size: 30px;
            font-weight: normal;
            letter-spacing: 2px;
            color: #264935;
            text-shadow: 0 0 10px rgba(38, 73, 53, 0.3);
            user-select: none;
        }

        /* Mniejszy link "go back" */
        .go-back-link {
            font-family: monospace;
            font-size: 14px;
            color: #555555;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .go-back-link:hover {
            color: #264935;
            text-shadow: 0 0 8px rgba(38, 73, 53, 0.5);
        }

        /* Animacja lewitacji dla wersji mobilnej */
        @keyframes mobileLevitate {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        @media (max-width: 768px) {
            .content-wrapper {
                animation: mobileLevitate 3.5s ease-in-out infinite;
            }
            .in-progress-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="content-wrapper" id="contentWrapper">
        <div class="in-progress-title">IN PROGRESS...</div>
        <a href="index.html" class="go-back-link">&larr; go back</a>
    </div>

    <script>
        // Niezależne, płynne pływanie elementu za myszką (desktop)
        document.addEventListener("DOMContentLoaded", function() {
            const wrapper = document.getElementById('contentWrapper');
            if (!wrapper) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            window.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Parametry ruchu analogiczne do guzików ze strony głównej
            const cfg = { rangeX: 9, rangeY: 7 };

            function animate() {
                if (window.innerWidth > 768) {
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;

                    const normX = (mouseX - centerX) / centerX;
                    const normY = (mouseY - centerY) / centerY;

                    // Delikatna fala czasowa żeby obiekt żył nawet przy bezruchu myszy
                    const time = Date.now() * 0.001;
                    const floatX = Math.sin(time * 1.5) * 2;
                    const floatY = Math.cos(time * 1.2) * 2.5;

                    const moveX = (normX * cfg.rangeX) + floatX;
                    const moveY = (normY * cfg.rangeY) + floatY;

                    wrapper.style.transform = `translate(${moveX}px, ${moveY}px)`;
                } else {
                    wrapper.style.transform = '';
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        });
    </script>

</body>
</html>
