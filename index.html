<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <!-- Prosty styl CSS -->
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Opcjonalne miejsce na boczne bannerki retro na desktopie (lewa strona) */
        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 20px;
            width: 88px;
        }

        /* Główny kontener strony o szerokości 1080px */
        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* 1. Górny banner */
        .banner-gora img {
            width: 100%;
            height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* 2. Czarny pasek z guzikami */
        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        /* 2.5. Margines 40px */
        .margin-box {
            height: 40px;
            background-color: #000000;
        }

        /* 3. Główny design (1080x1080px) */
        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* 4. Mini galeria / Karuzela */
        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #111;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .carousel-track {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px;
            align-items: center;
            scrollbar-width: thin;
            scrollbar-color: #444 #000;
        }

        .carousel-track::-webkit-scrollbar {
            height: 8px;
        }

        .carousel-track::-webkit-scrollbar-thumb {
            background: #444;
        }

        .carousel-item {
            flex: 0 0 auto;
            height: 90%;
            aspect-ratio: 4 / 3;
            scroll-snap-align: center;
            cursor: pointer;
            border: 2px solid #333;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 5. Grafika partners */
        .ls-partners img {
            width: 100%;
            height: 79px;
            object-fit: cover;
            display: block;
        }

        /* 6. Grafika dolna */
        .ls-dol img {
            width: 100%;
            height: 148px;
            object-fit: cover;
            display: block;
        }

        /* Lightbox (pełny ekran po kliknięciu w zdjęcie z karuzeli) */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 2px solid #fff;
        }

        /* Responsywność dla komputerów (pokazywanie bocznego tła / opcjonalnie bocznych bannerek) */
        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Opcjonalna lewa kolumna na retro bannerki 88x31 px (widoczna na dużych ekranach) -->
    <div class="side-banners-left">
        <!-- Tutaj w przyszłości możesz wrzucić wertykalne/mikro bannerki -->
    </div>

    <!-- Główny kontener strony -->
    <div class="main-container">

        <!-- 1) Górny banner -->
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.jpg" alt="Lost Section Banner">
            </a>
        </div>

        <!-- 2) Pasek z guzikami -->
        <div class="nav-bar">
            <a href="https://www.lost-section.com/about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="https://www.lost-section.com/">
                <img src="images/button_home_ls.png" alt="Home">
            </a>
            <a href="/archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
        </div>

        <!-- 2.5) Margines 40px -->
        <div class="margin-box"></div>

        <!-- 3) Główny design (1080x1080) -->
        <div class="main-design">
            <img src="images/main_design.jpg" alt="Main Design">
        </div>

        <!-- 4) Mini galeria (Karuzela 5 zdjęć) -->
        <div class="gallery-section">
            <div class="carousel-track">
                <div class="carousel-item"><img src="images/gallery_1.jpg" alt="Galeria 1" onclick="openLightbox(this.src)"></div>
                <div class="carousel-item"><img src="images/gallery_2.jpg" alt="Galeria 2" onclick="openLightbox(this.src)"></div>
                <div class="carousel-item"><img src="images/gallery_3.jpg" alt="Galeria 3" onclick="openLightbox(this.src)"></div>
                <div class="carousel-item"><img src="images/gallery_4.jpg" alt="Galeria 4" onclick="openLightbox(this.src)"></div>
                <div class="carousel-item"><img src="images/gallery_5.jpg" alt="Galeria 5" onclick="openLightbox(this.src)"></div>
            </div>
        </div>

        <!-- 5) Grafika Partners -->
        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <!-- 6) Stopka / ls_dol -->
        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>

    </div>

    <!-- Okno pełnoekranowe (Lightbox) do zdjęć z karuzeli -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full size">
    </div>

    <!-- Skrypt obsługujący powiększanie zdjęć -->
    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
