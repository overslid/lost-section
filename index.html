<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        img {
    display: block;
    max-width: none;
       }
        
        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: auto;
            min-width: 1080px;
            padding-top: 25px;
        }

        /* --- RETRO AUDIO PLAYER (Dokładnie 1080px) --- */
        .player-wrapper {
            width: 100%;
            max-width: 1080px;
            min-width: 1080px;
            padding: 0;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        #retro-player-bar {
            width: 1080px;
            height: 15px;
            background-color: #0d1a13;
            border: 1px solid #264935;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10000;
            font-family: monospace;
            font-size: 9px;
            color: #264935;
            padding: 0 8px;
            user-select: none;
            overflow: hidden;
            gap: 10px;
        }

        .player-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background-color: #0d1a13;
        }

        .player-btn {
            background: none;
            border: none;
            color: #264935;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .player-btn:hover {
            color: #ffffff;
        }

        /* Ruchomy tytuł utworu (marquee) */
        .track-title-container {
            width: 150px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            flex-shrink: 0;
        }

        .track-title-scroll {
            display: inline-block;
            color: #264935;
            animation: marqueeText 10s linear infinite;
        }

        @keyframes marqueeText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Licznik czasu utworu */
        .time-display {
            font-family: monospace;
            font-size: 9px;
            color: #264935;
            white-space: nowrap;
        }

        /* Pasek postępu utworu */
        .progress-container {
            width: 90px;
            height: 5px;
            background-color: #000000;
            border: 1px solid #264935;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 100%;
            background-color: #264935;
            width: 0%;
            pointer-events: none;
        }

        /* Suwak głośności */
        .volume-slider {
            -webkit-appearance: none;
            width: 40px;
            height: 4px;
            background: #000000;
            border: 1px solid #264935;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 5px;
            height: 7px;
            background: #264935;
            cursor: pointer;
        }

        /* Mini wizualizer audio */
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            width: 20px;
            flex-shrink: 0;
        }

        .vis-bar {
            width: 3px;
            background-color: #264935;
            height: 2px;
            transition: height 0.1s ease;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 35px;
            width: 88px;
        }

        @keyframes pulseFade {
            0% { opacity: 0.72; }
            50% { opacity: 0.92; }
            100% { opacity: 0.72; }
        }

        @keyframes buttonGlowPulse {
            0% { box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42); }
            50% { box-shadow: 0 8px 17px 1px rgba(6, 41, 23, 0.68); }
            100% { box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42); }
        }

        @keyframes mobileLevitate {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        .main-container {
            width: 1080px;
            max-width: 1080px;
            min-width: 1080px;
            background-color: #000000;
            position: relative;
            padding: 0;
            flex-shrink: 0;; /* Brak wewnętrznych marginesów – grafiki mają równe 1080px */
        }

        /* Efekt fade po bokach bloku 1080px */
        .main-container::before,
        .main-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 65px;
            z-index: 100;
            pointer-events: none;
            animation: pulseFade 4s ease-in-out infinite;
        }
        .main-container::before {
            left: -65px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }
        .main-container::after {
            right: -65px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }

        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        .nav-bar a {
            display: block;
            border-radius: 4px;
            animation: buttonGlowPulse 4s ease-in-out infinite;
            will-change: transform;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        .margin-box {
            height: 28px;
            background-color: #000000;
        }

        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 65px; 
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 0px; 
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px 0;
            align-items: center;
            justify-content: center;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            position: absolute;
            flex: 0 0 auto;
            height: 75%; 
            aspect-ratio: 4 / 3;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease-in-out;
            filter: brightness(0.45);
            opacity: 0;
            z-index: 1;
            transform: translateX(0) scale(0.85);
            pointer-events: none;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .carousel-item.active {
            height: 92%;
            filter: brightness(1);
            opacity: 1;
            z-index: 10;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .carousel-item.prev-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(-38%) scale(0.82);
            pointer-events: auto;
        }

        .carousel-item.next-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(38%) scale(0.82);
            pointer-events: auto;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #264935;
            border: 1px solid #264935;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 12px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .gallery-arrow:hover {
            background-color: #264935;
            color: #000000;
        }

        .gallery-arrow-left { left: 85px; }
        .gallery-arrow-right { right: 85px; }

        .visitor-counter-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
            transform: scale(0.9);
            transform-origin: center;
        }

        .micro-banners-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 25px;
            padding-left: 60px;
            padding-right: 60px;
        }

        .micro-banner-item img {
            height: 35px;
            width: auto;
            display: block;
            border: none;
        }

        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: none;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 10px;
            }
            .player-wrapper {
                padding: 0;
                margin-bottom: 10px;
            }
            #retro-player-bar {
                max-width: 100%;
                width: 100%;
                padding: 0 4px;
                gap: 6px;
                font-size: 8px;
            }
            .progress-container {
                width: 50px;
            }
            .track-title-container {
                width: 70px;
            }
            .main-container::before,
            .main-container::after {
                display: none;
            }
            .main-container {
                padding: 0;
            }
            .gallery-wrapper {
                padding: 0 50px; 
            }
            .gallery-arrow {
                font-size: 20px;
                padding: 8px 6px;
            }
            .gallery-arrow-left { left: 18px; }
            .gallery-arrow-right { right: 18px; }
            .nav-bar a img {
                width: 54px;
                height: 23px;
            }
            .nav-bar {
                gap: 50px;
                height: 45px;
            }
            .nav-bar a:nth-child(1) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.2s ease-in-out infinite;
            }
            .nav-bar a:nth-child(2) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.8s ease-in-out infinite 0.5s;
            }
            .nav-bar a:nth-child(3) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.5s ease-in-out infinite 1s;
            }
            .margin-box {
                height: 10px;
            }
            .gallery-section {
                height: 248px; 
            }
            .carousel-item.active {
                height: 76%; 
            }
            .carousel-item {
                height: 60%; 
            }
            .visitor-counter-section {
                margin-top: -15px;
                margin-bottom: 20px;
                transform: scale(0.6);
            }
            .micro-banners-section {
                margin-top: 15px;
                margin-bottom: 35px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .micro-banner-item img {
                height: 24px; 
            }
            .carousel-item.prev-item {
                transform: translateX(-36%) scale(0.82);
            }
            .carousel-item.next-item {
                transform: translateX(36%) scale(0.82);
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div id="retro-player-bar">
            <div class="player-group">
                <button class="player-btn" id="playPauseBtn">[PLAY]</button>
                <button class="player-btn" id="stopBtn">[STOP]</button>
            </div>
            <div class="player-group">
                <div class="track-title-container">
                    <span class="track-title-scroll">宇多田ヒカル【First Love】03 In my room</span>
                </div>
                <div class="audio-visualizer" id="audioVisualizer">
                    <div class="vis-bar"></div>
                    <div class="vis-bar"></div>
                    <div class="vis-bar"></div>
                    <div class="vis-bar"></div>
                </div>
                <div class="time-display" id="timeDisplay">00:05 / 00:00</div>
            </div>
            <div class="player-group">
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
            <div class="player-group">
                <span>VOL:</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.15">
            </div>
        </div>
    </div>

    <!-- Ukryty odtwarzacz audio -->
    <audio id="bgAudio" src="audio/track.mp3" loop></audio>
    <div class="side-banners-left"></div>

    <div class="main-container">
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.jpg" alt="Lost Section Banner">
            </a>
        </div>

        <div class="nav-bar" id="navBar">
            <a href="about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="index.html">
                <img src="images/button_home_ls.png" alt="Home">
            </a>
            <a href="archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
        </div>

        <div class="margin-box"></div>

        <div class="main-design">
            <img src="images/ls_design_main.jpg" alt="Main Design">
        </div>

        <div class="gallery-wrapper">
            <div class="gallery-arrow gallery-arrow-left" onclick="scrollGallery(-1)">‹</div>
            <div class="gallery-section" id="gallerySection">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>

        </div>

        <div class="visitor-counter-section">
            <div align="center">
                <a href="https://www.counter12.com"><img src="https://www.counter12.com/img-z06AAw9dA8Cb8BW9-36.gif" border="0" alt="contador"></a>
                <script type="text/javascript" src="https://www.counter12.com/ad.js?id=z06AAw9dA8Cb8BW9"></script>
            </div>
        </div>

        <div class="micro-banners-section" id="microBannersSection"></div>

        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full size">
    </div>

    <script>
        let galleryImagesLoaded = [];
        let currentIndex = 0;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const audio = document.getElementById('bgAudio');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const volumeSlider = document.getElementById('volumeSlider');
            const timeDisplay = document.getElementById('timeDisplay');
            const visBars = document.querySelectorAll('.vis-bar');

            let targetVolume = 0.15;
            volumeSlider.value = targetVolume;

            // Zawsze start od 5 sekundy
            audio.currentTime = 5;
            audio.volume = 0;

            playPauseBtn.addEventListener('click', function() {
                if (audio.paused) {
                    audio.currentTime = 5;
                    audio.volume = 0;
                    
                    audio.play().then(() => {
                        playPauseBtn.textContent = '[PAUSE]';
                        
                        // Płynne podgłaśnianie (fade-in) do 15%
                        let currentVol = 0;
                        let step = targetVolume / 20;
                        let fadeInterval = setInterval(() => {
                            currentVol += step;
                            if (currentVol >= targetVolume) {
                                currentVol = targetVolume;
                                audio.volume = currentVol;
                                clearInterval(fadeInterval);
                            } else {
                                audio.volume = currentVol;
                            }
                        }, 50);
                    }).catch(() => {});
                } else {
                    audio.pause();
                    playPauseBtn.textContent = '[PLAY]';
                }
            });

            stopBtn.addEventListener('click', function() {
                audio.pause();
                audio.currentTime = 5;
                audio.volume = targetVolume;
                playPauseBtn.textContent = '[PLAY]';
                progressBar.style.width = '0%';
                timeDisplay.textContent = "00:05 / " + formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', function() {
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBar.style.width = progressPercent + '%';
                    timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
                }

                if (!audio.paused) {
                    visBars.forEach(bar => {
                        const randomHeight = Math.floor(Math.random() * 8) + 2;
                        bar.style.height = randomHeight + 'px';
                    });
                } else {
                    visBars.forEach(bar => { bar.style.height = '2px'; });
                }
            });

            progressContainer.addEventListener('click', function(e) {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                if (audio.duration) {
                    audio.currentTime = (clickX / width) * audio.duration;
                }
            });

            volumeSlider.addEventListener('input', function() {
                targetVolume = parseFloat(volumeSlider.value);
                audio.volume = targetVolume;
            });

            const track = document.getElementById('carouselTrack');
            let maxToCheck = 15;

            for (let i = 1; i <= maxToCheck; i++) {
                const imgPath = `ls-gallery/${i}.jpg`;
                const img = new Image();
                
                img.onload = function() {
                    galleryImagesLoaded.push({ index: i, path: imgPath });
                    galleryImagesLoaded.sort((a, b) => a.index - b.index);
                    renderGallery();
                };
                img.onerror = function() {};
                img.src = imgPath;
            }

            function renderGallery() {
                track.innerHTML = '';
                galleryImagesLoaded.forEach((item, idx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'carousel-item';
                    if (idx === currentIndex) itemDiv.classList.add('active');
                    itemDiv.innerHTML = `<img src="${item.path}" alt="Galeria" onclick="openLightbox('${item.path}')">`;
                    track.appendChild(itemDiv);
                });
                updateGalleryActiveState();
            }

            loadAndRandomizeBlinkies();
            initOrganicButtonParallax();
        });

        function initOrganicButtonParallax() {
            const navBar = document.getElementById('navBar');
            if (!navBar) return;
            const buttons = navBar.querySelectorAll('a');
            if (buttons.length === 0) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            window.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            const buttonConfigs = [
                { rangeX: 7, rangeY: 5, offset: 0 },
                { rangeX: 5, rangeY: 8, offset: 2 },
                { rangeX: 8, rangeY: 6, offset: 4 }
            ];

            function animateButtons() {
                if (window.innerWidth > 768) {
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    const normX = (mouseX - centerX) / centerX;
                    const normY = (mouseY - centerY) / centerY;

                    buttons.forEach((btn, index) => {
                        const cfg = buttonConfigs[index] || buttonConfigs[0];
                        const time = Date.now() * 0.001;
                        const floatX = Math.sin(time * 1.5 + cfg.offset) * 2;
                        const floatY = Math.cos(time * 1.2 + cfg.offset) * 2.5;

                        const moveX = (normX * cfg.rangeX) + floatX;
                        const moveY = (normY * cfg.rangeY) + floatY;

                        btn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });
                } else {
                    buttons.forEach(btn => {
                        btn.style.transform = '';
                    });
                }
                requestAnimationFrame(animateButtons);
            }
            requestAnimationFrame(animateButtons);
        }

        function loadAndRandomizeBlinkies() {
            const blinkiesContainer = document.getElementById('microBannersSection');
            if (!blinkiesContainer) return;

            const baseNames = [];
            for (let n = 1; n <= 50; n++) {
                baseNames.push(`ls-blinkies/banner${n}`);
            }

            const extensions = ['.gif', '.png', '.jpg'];
            const isMobile = window.innerWidth <= 768;
            const limitCount = isMobile ? 10 : 15;

            let shuffledBases = [...baseNames];
            for (let j = shuffledBases.length - 1; j > 0; j--) {
                const r = Math.floor(Math.random() * (j + 1));
                [shuffledBases[j], shuffledBases[r]] = [shuffledBases[r], shuffledBases[j]];
            }

            blinkiesContainer.innerHTML = '';
            let loadedCount = 0;
            let indexToTry = 0;

            function tryFetchNext() {
                if (loadedCount >= limitCount || indexToTry >= shuffledBases.length) return;

                const currentBasePath = shuffledBases[indexToTry];
                indexToTry++;

                let extIndex = 0;

                function testExtension() {
                    if (extIndex >= extensions.length) {
                        tryFetchNext();
                        return;
                    }

                    const testPath = currentBasePath + extensions[extIndex];
                    extIndex++;

                    const testImg = new Image();
                    testImg.src = testPath;

                    testImg.onload = function() {
                        const bannerDiv = document.createElement('div');
                        bannerDiv.className = 'micro-banner-item';
                        bannerDiv.innerHTML = `<img src="${testPath}" alt="">`;
                        blinkiesContainer.appendChild(bannerDiv);

                        loadedCount++;
                        tryFetchNext();
                    };

                    testImg.onerror = function() {
                        testExtension();
                    };
                }
                testExtension();
            }
            tryFetchNext();
        }

        function updateGalleryActiveState() {
            const track = document.getElementById('carouselTrack');
            const items = track.querySelectorAll('.carousel-item');
            if (items.length === 0) return;

            items.forEach((item) => { item.className = 'carousel-item'; });

            if (items[currentIndex]) {
                items[currentIndex].classList.add('active');

                const prevIndex = (currentIndex - 1 + galleryImagesLoaded.length) % galleryImagesLoaded.length;
                if (items[prevIndex]) items[prevIndex].classList.add('prev-item');

                const nextIndex = (currentIndex + 1) % galleryImagesLoaded.length;
                if (items[nextIndex]) items[nextIndex].classList.add('next-item');
            }
        }

        function scrollGallery(direction) {
            if (galleryImagesLoaded.length === 0) return;
            currentIndex = (currentIndex + direction + galleryImagesLoaded.length) % galleryImagesLoaded.length;
            updateGalleryActiveState();
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
