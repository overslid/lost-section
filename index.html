<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <!-- Prosty styl CSS -->
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 15px; /* Odstęp od góry na stały pasek odtwarzacza */
        }

        /* --- RETRO AUDIO PLAYER (15px wysokości, na samej górze) --- */
        #retro-player-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background-color: #0d1a13;
            border-bottom: 1px solid #264935;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10000;
            font-family: monospace;
            font-size: 9px;
            color: #264935;
            padding: 0 10px;
            user-select: none;
            overflow: hidden;
        }

        .player-left, .player-right {
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2;
            background-color: #0d1a13; /* Krycie pod elementami pływającymi */
            flex-shrink: 0;
        }

        .player-btn {
            background: none;
            border: none;
            color: #264935;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .player-btn:hover {
            color: #ffffff;
        }

        /* Kontener na przewijający się napis w pętli (retro marquee) */
        .player-marquee-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            height: 15px;
            margin: 0 15px;
            display: flex;
            align-items: center;
        }

        @keyframes retroMarquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .player-marquee-text {
            position: absolute;
            white-space: nowrap;
            color: #264935;
            font-family: monospace;
            font-size: 9px;
            animation: retroMarquee 14s linear infinite;
        }

        /* Pasek postępu utworu */
        .progress-container {
            width: 150px;
            height: 5px;
            background-color: #000000;
            border: 1px solid #264935;
            cursor: pointer;
            position: relative;
            margin: 0 10px;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 100%;
            background-color: #264935;
            width: 0%;
            pointer-events: none;
        }

        /* Suwak głośności */
        .volume-slider {
            -webkit-appearance: none;
            width: 45px;
            height: 4px;
            background: #000000;
            border: 1px solid #264935;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 6px;
            height: 8px;
            background: #264935;
            cursor: pointer;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 35px; /* Przesunięte w dół o wysokość paska odtwarzacza */
            width: 88px;
        }

        /* Definicja animacji pulsowania fade'a */
        @keyframes pulseFade {
            0% {
                opacity: 0.72;
            }
            50% {
                opacity: 0.92;
            }
            100% {
                opacity: 0.72;
            }
        }

        /* Idealnie zbalansowana poświata pod guzikami */
        @keyframes buttonGlowPulse {
            0% {
                box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42);
            }
            50% {
                box-shadow: 0 8px 17px 1px rgba(6, 41, 23, 0.68);
            }
            100% {
                box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42);
            }
        }

        /* Animacja lewitacji dla wersji mobilnej */
        @keyframes mobileLevitate {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: #000000;
            position: relative;
            padding: 0 15px;
        }

        /* Efekt fade (poświata) po bokach CAŁEGO bloku */
        .main-container::before,
        .main-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 65px;
            z-index: 100;
            pointer-events: none;
            animation: pulseFade 4s ease-in-out infinite;
        }
        .main-container::before {
            left: -45px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }
        .main-container::after {
            right: -45px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }

        /* 1. Górny banner */
        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* 2. Czarny pasek z guzikami */
        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        /* Niezależnie pływające guziki na desktopie (sterowane przez JS) */
        .nav-bar a {
            display: block;
            border-radius: 4px;
            animation: buttonGlowPulse 4s ease-in-out infinite;
            will-change: transform;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        /* Margines 40px (Desktop) */
        .margin-box {
            height: 28px;
            background-color: #000000;
        }

        /* 3. Główny design (1080x1080px) */
        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* 4. Karuzela 3D */
        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 65px; 
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 0px; 
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px 0;
            align-items: center;
            justify-content: center;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            position: absolute;
            flex: 0 0 auto;
            height: 75%; 
            aspect-ratio: 4 / 3;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease-in-out;
            filter: brightness(0.45);
            opacity: 0;
            z-index: 1;
            transform: translateX(0) scale(0.85);
            pointer-events: none;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .carousel-item.active {
            height: 92%;
            filter: brightness(1);
            opacity: 1;
            z-index: 10;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .carousel-item.prev-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(-38%) scale(0.82);
            pointer-events: auto;
        }

        .carousel-item.next-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(38%) scale(0.82);
            pointer-events: auto;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #264935;
            border: 1px solid #264935;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 12px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .gallery-arrow:hover {
            background-color: #264935;
            color: #000000;
        }

        .gallery-arrow-left {
            left: 85px; 
        }

        .gallery-arrow-right {
            right: 85px; 
        }

        /* Licznik odwiedzin pod galerią */
        .visitor-counter-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
            transform: scale(0.9);
            transform-origin: center;
        }

        /* Mikro-bannerki */
        .micro-banners-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 25px;
            padding-left: 60px;
            padding-right: 60px;
        }

        .micro-banner-item img {
            height: 35px;
            width: auto;
            display: block;
            border: none;
        }

        /* 5. Grafika partners */
        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        /* 6. Grafika dolna */
        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: none;
        }

        /* --- Media Queries dla wersji mobilnej --- */
        @media (max-width: 768px) {
            .main-container::before,
            .main-container::after {
                display: none;
            }

            .main-container {
                padding: 0;
            }

            .gallery-wrapper {
                padding: 0 50px; 
            }

            .gallery-arrow {
                font-size: 20px;
                padding: 8px 6px;
            }
            .gallery-arrow-left {
                left: 18px; 
            }
            .gallery-arrow-right {
                right: 18px; 
            }

            .nav-bar a img {
                width: 54px;
                height: 23px;
            }

            .nav-bar {
                gap: 50px;
                height: 45px;
            }

            /* Na mobile guziki lewitują stale z różnym opóźnieniem */
            .nav-bar a:nth-child(1) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.2s ease-in-out infinite;
            }
            .nav-bar a:nth-child(2) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.8s ease-in-out infinite 0.5s;
            }
            .nav-bar a:nth-child(3) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.5s ease-in-out infinite 1s;
            }

            .margin-box {
                height: 10px;
            }

            .gallery-section {
                height: 248px; 
            }

            .carousel-item.active {
                height: 76%; 
            }

            .carousel-item {
                height: 60%; 
            }

            .visitor-counter-section {
                margin-top: -15px;
                margin-bottom: 20px;
                transform: scale(0.6);
            }

            .micro-banners-section {
                margin-top: 15px;
                margin-bottom: 35px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .micro-banner-item img {
                height: 24px; 
            }
            
            .carousel-item.prev-item {
                transform: translateX(-36%) scale(0.82);
            }
            .carousel-item.next-item {
                transform: translateX(36%) scale(0.82);
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>
