<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <!-- Prosty styl CSS -->
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 20px;
            width: 88px;
        }

        /* Definicja animacji pulsowania fade'a */
        @keyframes pulseFade {
            0% {
                opacity: 0.72;
            }
            50% {
                opacity: 0.92;
            }
            100% {
                opacity: 0.72;
            }
        }

        /* Specjalna animacja pulsowania poświaty pod guzikami */
        @keyframes buttonGlowPulse {
            0% {
                box-shadow: 0 12px 14px -4px rgba(2, 12, 8, 0.6);
            }
            50% {
                box-shadow: 0 16px 22px -4px rgba(2, 12, 8, 0.95);
            }
            100% {
                box-shadow: 0 12px 14px -4px rgba(2, 12, 8, 0.6);
            }
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: #000000;
            position: relative;
            padding: 0 15px;
        }

        /* Efekt fade (poświata) po bokach CAŁEGO bloku */
        .main-container::before,
        .main-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 65px;
            z-index: 100;
            pointer-events: none;
            animation: pulseFade 4s ease-in-out infinite;
        }
        .main-container::before {
            left: -45px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }
        .main-container::after {
            right: -45px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }

        /* 1. Górny banner */
        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* 2. Czarny pasek z guzikami */
        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        /* Poświata pod każdym pojedynczym guzikiem */
        .nav-bar a {
            display: block;
            border-radius: 4px;
            animation: buttonGlowPulse 4s ease-in-out infinite;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        /* Margines 40px (Desktop) */
        .margin-box {
            height: 28px;
            background-color: #000000;
        }

        /* 3. Główny design (1080x1080px) */
        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* 4. Karuzela 3D */
        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 65px; 
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 0px; 
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px 0;
            align-items: center;
            justify-content: center;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            position: absolute;
            flex: 0 0 auto;
            height: 75%; 
            aspect-ratio: 4 / 3;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease-in-out;
            filter: brightness(0.45);
            opacity: 0;
            z-index: 1;
            transform: translateX(0) scale(0.85);
            pointer-events: none;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .carousel-item.active {
            height: 92%;
            filter: brightness(1);
            opacity: 1;
            z-index: 10;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .carousel-item.prev-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(-38%) scale(0.82);
            pointer-events: auto;
        }

        .carousel-item.next-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(38%) scale(0.82);
            pointer-events: auto;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #264935;
            border: 1px solid #264935;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 12px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .gallery-arrow:hover {
            background-color: #264935;
            color: #000000;
        }

        .gallery-arrow-left {
            left: 85px; 
        }

        .gallery-arrow-right {
            right: 85px; 
        }

        /* Licznik odwiedzin (bliżej galerii o kolejne 10px na desktopie) */
        .visitor-counter-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
            transform: scale(0.9);
            transform-origin: center;
        }

        /* Mikro-bannerki */
        .micro-banners-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 25px;
            padding-left: 60px;
            padding-right: 60px;
        }

        .micro-banner-item img {
            height: 35px;
            width: auto;
            display: block;
            border: none;
        }

        /* 5. Grafika partners */
        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        /* 6. Grafika dolna */
        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: none;
        }

        /* --- Media Queries dla wersji mobilnej --- */
        @media (max-width: 768px) {
            .main-container::before,
            .main-container::after {
                display: none;
            }

            .main-container {
                padding: 0;
            }

            .gallery-wrapper {
                padding: 0 50px; 
            }

            .gallery-arrow {
                font-size: 20px;
                padding: 8px 6px;
            }
            .gallery-arrow-left {
                left: 18px; 
            }
            .gallery-arrow-right {
                right: 18px; 
            }

            .nav-bar a img {
                width: 54px;
                height: 23px;
            }

            .nav-bar {
                gap: 50px;
                height: 45px;
            }

            .margin-box {
                height: 10px;
            }

            .gallery-section {
                height: 248px; 
            }

            .carousel-item.active {
                height: 76%; 
            }

            .carousel-item {
                height: 60%; 
            }

            /* Licznik na mobile: przybliżony o kolejne 20px (margines górny 0px) */
            .visitor-counter-section {
                margin-top: 0px;
                margin-bottom: 20px;
                transform: scale(0.6);
            }

            .micro-banners-section {
                margin-top: 15px;
                margin-bottom: 35px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .micro-banner-item img {
                height: 24px; 
            }
            
            .carousel-item.prev-item {
                transform: translateX(-36%) scale(0.82);
            }
            .carousel-item.next-item {
                transform: translateX(36%) scale(0.82);
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="side-banners-left"></div>

    <div class="main-container">

        <!-- 1) Górny banner -->
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.jpg" alt="Lost Section Banner">
            </a>
        </div>

        <!-- 2) Pasek z guzikami (z poświatą pod każdym z nich) -->
        <div class="nav-bar">
            <a href="https://www.lost-section.com/about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="https://www.lost-section.com/">
                <img src="images/button_home_ls.png" alt="Home">
            </a>
            <a href="/archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
        </div>

        <!-- Margines -->
        <div class="margin-box"></div>

        <!-- 3) Główny design (1080x1080) -->
        <div class="main-design">
            <img src="images/ls_design_main.jpg" alt="Main Design">
        </div>

        <!-- 4) Mini galeria dynamiczna -->
        <div class="gallery-wrapper">
            <div class="gallery-arrow gallery-arrow-left" onclick="scrollGallery(-1)">‹</div>
            <div class="gallery-section" id="gallerySection">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Zdjęcia ładowane automatycznie przez JavaScript -->
                </div>
            </div>
            <div class="gallery-arrow gallery-arrow-right" onclick="scrollGallery(1)">›</div>
        </div>

        <!-- Licznik odwiedzin pod galerią -->
        <div class="visitor-counter-section">
            <div align="center">
                <a href="https://www.counter12.com"><img src="https://www.counter12.com/img-z06AAw9dA8Cb8BW9-36.gif" border="0" alt="contador"></a>
                <script type="text/javascript" src="https://www.counter12.com/ad.js?id=z06AAw9dA8Cb8BW9"></script>
            </div>
        </div>

        <!-- Sekcja na mikro-bannerki -->
        <div class="micro-banners-section" id="microBannersSection">
            <!-- Losowane bannerki ładowane natychmiast -->
        </div>

        <!-- 5) Grafika Partners -->
        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <!-- 6) Stopka -->
        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full size">
    </div>

    <script>
        let galleryImagesLoaded = [];
        let currentIndex = 0;

        // 1. Automatyczne ładowanie zdjęć głównej galerii z folderu ls-gallery
        document.addEventListener("DOMContentLoaded", function() {
            const track = document.getElementById('carouselTrack');
            let i = 1;
            
            function checkNextImage() {
                const imgPath = `ls-gallery/${i}.jpg`;
                const img = new Image();
                img.src = imgPath;
                
                img.onload = function() {
                    galleryImagesLoaded.push(imgPath);
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'carousel-item';
                    itemDiv.innerHTML = `<img src="${imgPath}" alt="Galeria ${i}" onclick="openLightbox('${imgPath}')">`;
                    track.appendChild(itemDiv);
                    
                    i++;
                    checkNextImage();
                };
                
                img.onerror = function() {
                    updateGalleryActiveState();
                };
            }
            
            checkNextImage();

            // 2. Błyskawiczne i bezpieczne losowanie bannerków
            loadAndRandomizeBlinkies();
        });

        function loadAndRandomizeBlinkies() {
            const blinkiesContainer = document.getElementById('microBannersSection');
            if (!blinkiesContainer) return;

            const baseNames = [];
            for (let n = 1; n <= 50; n++) {
                baseNames.push(`ls-blinkies/banner${n}`);
            }

            const extensions = ['.gif', '.png', '.jpg'];
            const isMobile = window.innerWidth <= 768;
            const limitCount = isMobile ? 10 : 15;

            let shuffledBases = [...baseNames];
            for (let j = shuffledBases.length - 1; j > 0; j--) {
                const r = Math.floor(Math.random() * (j + 1));
                [shuffledBases[j], shuffledBases[r]] = [shuffledBases[r], shuffledBases[j]];
            }

            blinkiesContainer.innerHTML = '';
            let loadedCount = 0;
            let indexToTry = 0;

            function tryFetchNext() {
                if (loadedCount >= limitCount || indexToTry >= shuffledBases.length) return;

                const currentBasePath = shuffledBases[indexToTry];
                indexToTry++;

                let extIndex = 0;

                function testExtension() {
                    if (extIndex >= extensions.length) {
                        tryFetchNext();
                        return;
                    }

                    const testPath = currentBasePath + extensions[extIndex];
                    extIndex++;

                    const testImg = new Image();
                    testImg.src = testPath;

                    testImg.onload = function() {
                        const bannerDiv = document.createElement('div');
                        bannerDiv.className = 'micro-banner-item';
                        bannerDiv.innerHTML = `<img src="${testPath}" alt="">`;
                        blinkiesContainer.appendChild(bannerDiv);

                        loadedCount++;
                        tryFetchNext();
                    };

                    testImg.onerror = function() {
                        testExtension();
                    };
                }

                testExtension();
            }

            tryFetchNext();
        }

        function updateGalleryActiveState() {
            const track = document.getElementById('carouselTrack');
            const items = track.querySelectorAll('.carousel-item');
            if (items.length === 0) return;

            items.forEach((item) => {
                item.className = 'carousel-item';
            });

            items[currentIndex].classList.add('active');

            const prevIndex = (currentIndex - 1 + galleryImagesLoaded.length) % galleryImagesLoaded.length;
            items[prevIndex].classList.add('prev-item');

            const nextIndex = (currentIndex + 1) % galleryImagesLoaded.length;
            items[nextIndex].classList.add('next-item');
        }

        function scrollGallery(direction) {
            if (galleryImagesLoaded.length === 0) return;
            currentIndex = (currentIndex + direction + galleryImagesLoaded.length) % galleryImagesLoaded.length;
            updateGalleryActiveState();
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
