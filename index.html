<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <!-- Prosty styl CSS -->
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 20px;
            width: 88px;
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: #000000;
            position: relative;
        }

        /* 1. Górny banner */
        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* 2. Czarny pasek z guzikami */
        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        /* 2.5. Margines 40px */
        .margin-box {
            height: 40px;
            background-color: #000000;
        }

        /* 3. Główny design (1080x1080px) */
        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* 4. Mini galeria / Karuzela */
        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .carousel-track {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px;
            align-items: center;
            /* Wymuszenie widoczności scrollbara na mobile */
            scrollbar-width: thin;
            scrollbar-color: #264935 #000000;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-track::-webkit-scrollbar {
            height: 10px;
            display: block !important;
        }

        .carousel-track::-webkit-scrollbar-track {
            background: #000000;
        }

        .carousel-track::-webkit-scrollbar-thumb {
            background: #264935;
            border-radius: 4px;
        }

        .carousel-item {
            flex: 0 0 auto;
            height: 90%;
            aspect-ratio: 4 / 3;
            scroll-snap-align: center;
            cursor: pointer;
            border: none;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        /* Strzałki sugerujące galerię (widoczne głównie na mobile) */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #264935;
            border: 1px solid #264935;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 6px;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        .gallery-arrow-left {
            left: 5px;
        }

        .gallery-arrow-right {
            right: 5px;
        }

        /* Pole na mikro-bannerki */
        .micro-banners-section {
            width: 100%;
            min-height: 160px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 10px;
        }

        .micro-banner-item img {
            height: 45px;
            width: auto;
            display: block;
            border: none;
        }

        /* 5. Grafika partners */
        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        /* 6. Grafika dolna */
        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 2px solid #fff;
        }

        /* --- Media Queries dla wersji mobilnej --- */
        @media (max-width: 768px) {
            /* Guziki mniejsze o ok. 35% */
            .nav-bar a img {
                width: 75px;
                height: 32px;
            }

            .nav-bar {
                gap: 8px;
                height: 50px;
            }

            /* Mniejsze zdjęcia w galerii na mobile, żeby widac było więcej kontekstu */
            .gallery-section {
                height: 260px;
            }

            .carousel-item {
                height: 80%;
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="side-banners-left"></div>

    <div class="main-container">

        <!-- 1) Górny banner -->
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.jpg" alt="Lost Section Banner">
            </a>
        </div>

        <!-- 2) Pasek z guzikami -->
        <div class="nav-bar">
            <a href="https://www.lost-section.com/about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="https://www.lost-section.com/">
                <img src="images/button_home_ls.png" alt="Home">
            </a>
            <a href="/archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
        </div>

        <!-- 2.5) Margines 40px -->
        <div class="margin-box"></div>

        <!-- 3) Główny design (1080x1080) -->
        <div class="main-design">
            <img src="images/ls_design_main.jpg" alt="Main Design">
        </div>

        <!-- 4) Mini galeria ze strzałkami pomocniczymi -->
        <div class="gallery-wrapper">
            <div class="gallery-arrow gallery-arrow-left" onclick="scrollGallery(-1)">‹</div>
            <div class="gallery-section" id="gallerySection">
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-item"><img src="ls-gallery/1.jpg" alt="Galeria 1" onclick="openLightbox(this.src)"></div>
                    <div class="carousel-item"><img src="ls-gallery/2.jpg" alt="Galeria 2" onclick="openLightbox(this.src)"></div>
                    <div class="carousel-item"><img src="ls-gallery/3.jpg" alt="Galeria 3" onclick="openLightbox(this.src)"></div>
                    <div class="carousel-item"><img src="ls-gallery/4.jpg" alt="Galeria 4" onclick="openLightbox(this.src)"></div>
                    <div class="carousel-item"><img src="ls-gallery/5.jpg" alt="Galeria 5" onclick="openLightbox(this.src)"></div>
                </div>
            </div>
            <div class="gallery-arrow gallery-arrow-right" onclick="scrollGallery(1)">›</div>
        </div>

        <!-- Sekcja na mikro-bannerki -->
        <div class="micro-banners-section">
            <div class="micro-banner-item"><img src="ls-blinkies/banner1.gif" alt="Blinkie"></div>
            <div class="micro-banner-item"><img src="ls-blinkies/banner2.png" alt="Blinkie"></div>
            <div class="micro-banner-item"><img src="ls-blinkies/banner3.jpg" alt="Blinkie"></div>
        </div>

        <!-- 5) Grafika Partners -->
        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <!-- 6) Stopka -->
        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full size">
    </div>

    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Pomocnicza funkcja do przesuwania karuzeli strzałkami po bokach
        function scrollGallery(direction) {
            const track = document.getElementById('carouselTrack');
            const scrollAmount = 250; // o ile pikseli przesuwa kliknięcie strzałki
            track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }
    </script>

</body>
</html>
