<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <style>
        /* Reset i ogólne ustawienia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        img {
    display: block;
    max-width: none;
       }
        
        body {
            background-color: #000000;
            font-family: monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: auto;
            min-width: 1080px;
            padding-top: 25px;
        }

        /* --- RETRO AUDIO PLAYER (Dokładnie 1080px) ---
           Lewa strona: sterowanie (play, stop, głośność, przewijanie)
           Prawa strona: informacje (tytuł, czas, wizualizer)
           Wszystkie odstępy = --pl-gap, a suwaki to segmentowe "piksele" w stylu Winampa */
        .player-wrapper {
            width: 100%;
            max-width: 1080px;
            min-width: 1080px;
            padding: 0;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        #retro-player-bar {
            --pl-gap: 12px;
            --pl-green: #264935;
            --pl-dim: rgba(38, 73, 53, 0.30);
            position: relative;
            width: 1080px;
            height: 18px;
            background-color: #0d1a13;
            border: 1px solid #264935;
            box-shadow: inset 0 0 0 1px #08120d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10000;
            font-family: monospace;
            font-size: 9px;
            color: #264935;
            padding: 0 9px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            gap: var(--pl-gap);
        }

        /* delikatne "linie CRT" na całym pasku */
        #retro-player-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
        }

        .player-group {
            display: flex;
            align-items: center;
            align-self: stretch;
            gap: var(--pl-gap);
            flex-shrink: 0;
        }

        .player-btn {
            background: none;
            border: none;
            color: #264935;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
            padding: 0;
            align-self: stretch;
            transition: color 0.2s;
        }

        #playPauseBtn {
            min-width: 7ch;
            text-align: left;
        }

        .player-label {
            color: #264935;
            letter-spacing: 0.5px;
        }

        /* cienki separator między sekcjami */
        .player-sep {
            width: 1px;
            height: 10px;
            background: #264935;
            opacity: 0.5;
            flex-shrink: 0;
        }

        /* Segmentowy suwak (wspólny dla głośności i przewijania):
           segment 3px + 1px przerwy, szerokość = n*4-1 px */
        .seg-bar {
            position: relative;
            width: 47px;
            height: 8px;
            flex-shrink: 0;
            cursor: pointer;
            touch-action: none;
            background: repeating-linear-gradient(90deg, var(--pl-dim) 0 3px, transparent 3px 4px);
        }

        .seg-bar.seg-seek {
            width: 159px;
        }

        /* niewidoczny, powiększony obszar dotyku */
        .seg-bar::after {
            content: "";
            position: absolute;
            top: -9px;
            bottom: -9px;
            left: -4px;
            right: -4px;
        }

        .seg-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            pointer-events: none;
            background: repeating-linear-gradient(90deg, var(--pl-green) 0 3px, transparent 3px 4px);
        }

        .seg-bar:focus-visible {
            outline: 1px solid #264935;
            outline-offset: 3px;
        }

        @media (hover: hover) {
            .player-btn:hover {
                color: #ffffff;
            }
            .seg-bar:hover .seg-fill {
                background: repeating-linear-gradient(90deg, #ffffff 0 3px, transparent 3px 4px);
            }
        }

        /* Ruchomy tytuł utworu (marquee) z wygaszonymi brzegami */
        .track-title-container {
            width: 220px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            flex-shrink: 0;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
        }

        .track-title-scroll {
            display: inline-block;
            color: #264935;
            animation: marqueeText 10s linear infinite;
        }

        @keyframes marqueeText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Licznik czasu utworu */
        .time-display {
            font-family: monospace;
            font-size: 9px;
            color: #264935;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        /* Mini wizualizer audio (pikselowe słupki 3px + 1px przerwy) */
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 1px;
            height: 10px;
            width: 19px;
            flex-shrink: 0;
        }

        .vis-bar {
            width: 3px;
            background-color: #264935;
            height: 2px;
            transition: height 0.1s ease;
        }

        .side-banners-left {
            display: none;
            position: fixed;
            left: 20px;
            top: 35px;
            width: 88px;
        }

        @keyframes pulseFade {
            0% { opacity: 0.72; }
            50% { opacity: 0.92; }
            100% { opacity: 0.72; }
        }

        @keyframes buttonGlowPulse {
            0% { box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42); }
            50% { box-shadow: 0 8px 17px 1px rgba(6, 41, 23, 0.68); }
            100% { box-shadow: 0 5px 12px 0 rgba(3, 24, 14, 0.42); }
        }

        @keyframes mobileLevitate {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        .main-container {
            width: 1080px;
            max-width: 1080px;
            min-width: 1080px;
            background-color: #000000;
            position: relative;
            padding: 0;
            flex-shrink: 0;; /* Brak wewnętrznych marginesów – grafiki mają równe 1080px */
        }

        /* Efekt fade po bokach bloku 1080px */
        .main-container::before,
        .main-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 65px;
            z-index: 100;
            pointer-events: none;
            animation: pulseFade 4s ease-in-out infinite;
        }
        .main-container::before {
            left: -65px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }
        .main-container::after {
            right: -65px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(2, 12, 8, 0.90));
        }

        .banner-gora img {
            width: 100%;
            height: auto;
            max-height: 246px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .nav-bar {
            background-color: #000000;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 140px;
        }

        .nav-bar a {
            display: block;
            border-radius: 4px;
            animation: buttonGlowPulse 4s ease-in-out infinite;
            will-change: transform;
        }

        .nav-bar a img {
            width: 116px;
            height: 50px;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s;
        }

        .nav-bar a img:hover {
            opacity: 0.8;
        }

        .margin-box {
            height: 28px;
            background-color: #000000;
        }

        .main-design img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .gallery-wrapper {
            position: relative;
            background-color: #000000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 65px; 
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .gallery-section {
            width: 100%;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 0px; 
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            padding: 10px 0;
            align-items: center;
            justify-content: center;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            position: absolute;
            flex: 0 0 auto;
            height: 75%; 
            aspect-ratio: 4 / 3;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease-in-out;
            filter: brightness(0.45);
            opacity: 0;
            z-index: 1;
            transform: translateX(0) scale(0.85);
            pointer-events: none;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .carousel-item.active {
            height: 92%;
            filter: brightness(1);
            opacity: 1;
            z-index: 10;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .carousel-item.prev-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(-38%) scale(0.82);
            pointer-events: auto;
        }

        .carousel-item.next-item {
            opacity: 0.7;
            z-index: 5;
            transform: translateX(38%) scale(0.82);
            pointer-events: auto;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #264935;
            border: 1px solid #264935;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 12px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .gallery-arrow:hover {
            background-color: #264935;
            color: #000000;
        }

        .gallery-arrow-left { left: 85px; }
        .gallery-arrow-right { right: 85px; }

        .visitor-counter-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
            transform: scale(0.9);
            transform-origin: center;
        }

        .micro-banners-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 25px;
            padding-left: 60px;
            padding-right: 60px;
        }

        .micro-banner-item img {
            height: 35px;
            width: auto;
            display: block;
            border: none;
        }

        .ls-partners img {
            width: 100%;
            height: auto;
            max-height: 79px;
            object-fit: cover;
            display: block;
        }

        .ls-dol img {
            width: 100%;
            height: auto;
            max-height: 148px;
            object-fit: cover;
            display: block;
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: none;
        }

        @media (max-width: 768px) {
            /* Na telefonie nic nie ma sztywnych 1080px - blok grafik rozciąga się
               na całą szerokość ekranu (przeglądarka sama skaluje grafiki 1080px) */
            *, img {
                max-width: 100%;
            }
            body {
                padding-top: 10px;
                min-width: 0;
                overflow-x: hidden;
            }
            .player-wrapper {
                width: 100%;
                min-width: 0;
                max-width: 100%;
                padding: 0;
                margin-bottom: 10px;
            }
            #retro-player-bar {
                --pl-gap: 7px;
                width: 100%;
                max-width: 100%;
                height: 17px;
                padding: 0 7px;
                font-size: 10px;
            }
            .player-btn,
            .time-display {
                font-size: 10px;
            }
            .player-sep {
                height: 8px;
            }
            .seg-bar {
                width: 31px;
                height: 7px;
            }
            /* Na telefonie pasek postępu jest tylko wskaźnikiem (bez przewijania) */
            .seg-bar.seg-seek {
                width: 43px;
                pointer-events: none;
                cursor: default;
            }
            .seg-bar.seg-seek::after {
                display: none;
            }
            .track-title-container {
                width: 56px;
            }
            /* Na wąskim ekranie pokazujemy tylko bieżący czas (bez " / długość") */
            .time-total {
                display: none;
            }
            .main-container {
                width: 100%;
                min-width: 0;
                max-width: 100%;
            }
            .main-container::before,
            .main-container::after {
                display: none;
            }
            .main-container {
                padding: 0;
            }
            .gallery-wrapper {
                padding: 0 50px; 
            }
            .gallery-arrow {
                font-size: 20px;
                padding: 8px 6px;
            }
            .gallery-arrow-left { left: 18px; }
            .gallery-arrow-right { right: 18px; }
            .nav-bar a img {
                width: 54px;
                height: 23px;
            }
            .nav-bar {
                gap: 50px;
                height: 45px;
            }
            .nav-bar a:nth-child(1) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.2s ease-in-out infinite;
            }
            .nav-bar a:nth-child(2) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.8s ease-in-out infinite 0.5s;
            }
            .nav-bar a:nth-child(3) {
                animation: buttonGlowPulse 4s ease-in-out infinite, mobileLevitate 3.5s ease-in-out infinite 1s;
            }
            .margin-box {
                height: 10px;
            }
            .gallery-section {
                height: 248px; 
            }
            .carousel-item.active {
                height: 76%; 
            }
            .carousel-item {
                height: 60%; 
            }
            .visitor-counter-section {
                margin-top: -15px;
                margin-bottom: 20px;
                transform: scale(0.6);
            }
            .micro-banners-section {
                margin-top: 15px;
                margin-bottom: 35px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .micro-banner-item img {
                height: 24px; 
            }
            .carousel-item.prev-item {
                transform: translateX(-36%) scale(0.82);
            }
            .carousel-item.next-item {
                transform: translateX(36%) scale(0.82);
            }
        }

        @media (min-width: 1084px) {
            .side-banners-left {
                display: block;
            }
        }
    </style>
</head>

    <script>
        let galleryImagesLoaded = [];
        let currentIndex = 0;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const audioEl = document.getElementById('bgAudio');

            // --- iOS: odtwarzanie przez samo Web Audio (bufor) ---
            // Na iOS element <audio> podpięty pod Web Audio przestaje aktualizować czas i ignoruje
            // przewijanie, a start od 5. sekundy nie jest pewny. Dlatego na iPhonie/iPadzie utwór jest
            // dekodowany do bufora, a czas liczymy sami. Interfejs jest taki sam jak w <audio>.
            class BufferPlayer {
                constructor(url) {
                    this.url = url;
                    this.ctx = null;
                    this.gain = null;
                    this.buffer = null;
                    this.source = null;
                    this.offset = 0;
                    this.startedAt = 0;
                    this.paused = true;
                    this.loading = false;
                    this.duration = NaN;
                    this._vol = 0;
                    this._loadPromise = null;
                }
                _ensureCtx() {
                    if (this.ctx) return;
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                    this.gain = this.ctx.createGain();
                    this.gain.gain.value = this._vol;
                    this.gain.connect(this.ctx.destination);
                }
                _load() {
                    if (this.buffer) return Promise.resolve();
                    if (!this._loadPromise) {
                        this._loadPromise = fetch(this.url)
                            .then(r => {
                                if (!r.ok) throw new Error('HTTP ' + r.status);
                                return r.arrayBuffer();
                            })
                            .then(ab => new Promise((resolve, reject) => {
                                const p = this.ctx.decodeAudioData(ab, resolve, reject);
                                if (p && p.catch) p.catch(reject);
                            }))
                            .then(buf => {
                                this.buffer = buf;
                                this.duration = buf.duration;
                            })
                            .catch(err => { this._loadPromise = null; throw err; });
                    }
                    return this._loadPromise;
                }
                get currentTime() {
                    if (this.paused || !this.buffer) return this.offset;
                    return (this.offset + (this.ctx.currentTime - this.startedAt)) % this.buffer.duration;
                }
                set currentTime(t) {
                    this.offset = Math.max(0, t);
                    if (!this.paused && this.buffer) this._startSource();
                }
                setGain(v) {
                    this._vol = v;
                    if (this.gain) this.gain.gain.value = v;
                }
                _stopSource() {
                    if (!this.source) return;
                    try { this.source.stop(); } catch (e) {}
                    try { this.source.disconnect(); } catch (e) {}
                    this.source = null;
                }
                _startSource() {
                    this._stopSource();
                    const s = this.ctx.createBufferSource();
                    s.buffer = this.buffer;
                    s.loop = true;
                    s.connect(this.gain);
                    this.offset = this.offset % this.buffer.duration;
                    s.start(0, this.offset);
                    this.startedAt = this.ctx.currentTime;
                    this.source = s;
                }
                play() {
                    this._ensureCtx();
                    // resume i "odblokowanie" muszą nastąpić synchronicznie w obsłudze kliknięcia (wymóg iOS)
                    const resumeP = this.ctx.state === 'suspended' ? this.ctx.resume() : Promise.resolve();
                    const resumed = Promise.race([resumeP, new Promise(r => setTimeout(r, 1500))]);
                    try {
                        const silent = this.ctx.createBuffer(1, 1, 22050);
                        const src = this.ctx.createBufferSource();
                        src.buffer = silent;
                        src.connect(this.ctx.destination);
                        src.start(0);
                    } catch (e) {}
                    this.loading = true;
                    return Promise.all([resumed, this._load()]).then(() => {
                        this.loading = false;
                        this.gain.gain.value = this._vol;
                        this.paused = false;
                        this._startSource();
                    }).catch(err => {
                        this.loading = false;
                        throw err;
                    });
                }
                pause() {
                    if (this.paused) return;
                    this.offset = this.currentTime;
                    this._stopSource();
                    this.paused = true;
                }
                addEventListener() {} // brak zdarzeń timeupdate - UI korzysta z własnego zegara
            }

            const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            let usesBuffer = isIOS && !!(window.AudioContext || window.webkitAudioContext);
            let audio = usesBuffer ? new BufferPlayer(audioEl.getAttribute('src')) : audioEl;

            // --- iOS: dźwięk ma grać mimo bocznego przełącznika wyciszenia ---
            // Web Audio jest domyślnie wyciszane przełącznikiem, a zwykły <audio> nie. Ustawiamy sesję audio
            // na "playback" (iOS 16.4+) i dodatkowo odtwarzamy w tle cichy, zapętlony plik (starsze iOS).
            const SILENT_WAV = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            let silentEl = null;
            function startSilentKeeper() {
                try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
                try {
                    if (!silentEl) {
                        silentEl = new Audio(SILENT_WAV);
                        silentEl.loop = true;
                        silentEl.setAttribute('playsinline', '');
                    }
                    const pr = silentEl.play();
                    if (pr && pr.catch) pr.catch(() => {});
                } catch (e) {}
            }
            function stopSilentKeeper() {
                try { if (silentEl) silentEl.pause(); } catch (e) {}
            }
            const isMobileLayout = () => window.matchMedia('(max-width: 768px)').matches;

            const playPauseBtn = document.getElementById('playPauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const progressFill = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const volumeBar = document.getElementById('volumeBar');
            const volumeFill = document.getElementById('volumeFill');
            const timeCur = document.getElementById('timeCur');
            const timeTotal = document.getElementById('timeTotal');
            const visBars = document.querySelectorAll('.vis-bar');

            let targetVolume = 0.15;

            // --- Segmentowe suwaki: wypełnienie zawsze kończy się na pełnym segmencie ---
            const SEG = 4; // 3px segment + 1px przerwy
            const clamp01 = (v) => Math.min(Math.max(v, 0), 1);

            function setSegFill(fillEl, barEl, ratio) {
                const segCount = Math.max(1, Math.round((barEl.clientWidth + 1) / SEG));
                const filled = Math.round(clamp01(ratio) * segCount);
                fillEl.style.width = filled ? (filled * SEG - 1) + 'px' : '0px';
            }

            function renderVolume() {
                setSegFill(volumeFill, volumeBar, targetVolume);
                volumeBar.setAttribute('aria-valuenow', Math.round(targetVolume * 100));
            }

            function currentProgressRatio() {
                return audio.duration ? audio.currentTime / audio.duration : 0;
            }

            function renderProgress(ratio) {
                setSegFill(progressFill, progressContainer, ratio);
                progressContainer.setAttribute('aria-valuenow', Math.round(clamp01(ratio) * 100));
            }

            // Przeciąganie myszką/palcem po suwaku (pointer events)
            // onChange(ratio, final, isStart): isStart = pierwszy dotyk, final = koniec gestu
            function bindSegDrag(el, onChange) {
                let active = false;
                let lastRatio = 0;
                const ratioOf = (e) => {
                    const r = el.getBoundingClientRect();
                    return clamp01((e.clientX - r.left) / r.width);
                };
                el.addEventListener('pointerdown', (e) => {
                    active = true;
                    try { el.setPointerCapture(e.pointerId); } catch (err) {}
                    lastRatio = ratioOf(e);
                    onChange(lastRatio, false, true);
                });
                el.addEventListener('pointermove', (e) => {
                    if (!active) return;
                    lastRatio = ratioOf(e);
                    onChange(lastRatio, false, false);
                });
                const finish = (e) => {
                    if (!active) return;
                    active = false;
                    if (e && typeof e.clientX === 'number' && e.type === 'pointerup') lastRatio = ratioOf(e);
                    onChange(lastRatio, true, false); // także przy pointercancel (iOS) - używamy ostatniej pozycji
                };
                el.addEventListener('pointerup', finish);
                el.addEventListener('pointercancel', finish);
            }

            // --- Głośność przez Web Audio (GainNode) ---
            // iOS Safari ignoruje audio.volume (jest tylko do odczytu), a GainNode działa wszędzie.
            // Graf tworzymy dopiero przy pierwszym kliknięciu (wymóg przeglądarek).
            let audioCtx = null;
            let gainNode = null;

            function ensureAudioGraph() {
                if (usesBuffer || audioCtx) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AC();
                    const source = audioCtx.createMediaElementSource(audio);
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 0;
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    audio.volume = 1; // poziom ustawia teraz gainNode
                } catch (e) {
                    audioCtx = null;
                    gainNode = null; // awaryjnie: zwykłe audio.volume
                }
            }

            function setVolume(v) {
                if (usesBuffer) {
                    audio.setGain(v);
                } else if (gainNode) {
                    gainNode.gain.value = v;
                } else {
                    audio.volume = v;
                }
            }

            let fadeInterval = null;

            // Zawsze start od 5 sekundy
            audio.currentTime = 5;
            if (!usesBuffer) audio.volume = 0;

            function resetTimeDisplay() {
                timeCur.textContent = formatTime(5);
                timeTotal.textContent = " / " + formatTime(audio.duration);
            }

            playPauseBtn.addEventListener('click', function() {
                if (audio.loading) return; // trwa ładowanie utworu (iOS)
                if (audio.paused) {
                    ensureAudioGraph();
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    audio.currentTime = 5;
                    setVolume(0);
                    if (usesBuffer) {
                        playPauseBtn.textContent = '[LOAD]';
                        startSilentKeeper(); // musi być w obsłudze kliknięcia
                    }

                    audio.play().then(() => {
                        playPauseBtn.textContent = '[PAUSE]';

                        // Płynne podgłaśnianie (fade-in) do ustawionej głośności
                        clearInterval(fadeInterval);
                        let currentVol = 0;
                        fadeInterval = setInterval(() => {
                            currentVol += targetVolume / 20;
                            if (currentVol >= targetVolume) {
                                setVolume(targetVolume);
                                clearInterval(fadeInterval);
                            } else {
                                setVolume(currentVol);
                            }
                        }, 50);
                    }).catch(() => {
                        if (usesBuffer) {
                            // silnik buforowy zawiódł (pobieranie/dekodowanie) -> wracamy do zwykłego <audio>,
                            // które zadziała od następnego kliknięcia
                            usesBuffer = false;
                            stopSilentKeeper();
                            audio = audioEl;
                            audio.currentTime = 5;
                            audio.volume = 0;
                            playPauseBtn.textContent = '[ERR]';
                            setTimeout(() => { playPauseBtn.textContent = '[PLAY]'; }, 1200);
                        } else {
                            playPauseBtn.textContent = '[PLAY]';
                        }
                    });
                } else {
                    clearInterval(fadeInterval);
                    stopSilentKeeper();
                    audio.pause();
                    playPauseBtn.textContent = '[PLAY]';
                }
            });

            stopBtn.addEventListener('click', function() {
                clearInterval(fadeInterval);
                stopSilentKeeper();
                audio.pause();
                audio.currentTime = 5;
                setVolume(targetVolume);
                playPauseBtn.textContent = '[PLAY]';
                renderProgress(0);
                resetTimeDisplay();
            });

            let seekDragging = false;

            audioEl.addEventListener('timeupdate', function() {
                if (audio.duration) {
                    if (!seekDragging) renderProgress(currentProgressRatio());
                    timeCur.textContent = formatTime(audio.currentTime);
                    timeTotal.textContent = " / " + formatTime(audio.duration);
                }

            });

            // Własny zegar (niezależny od zdarzenia timeupdate, które na iOS bywa zawodne):
            // animuje wizualizer i odświeża pasek postępu oraz czas, gdy muzyka gra
            setInterval(function() {
                if (!audio.paused) {
                    visBars.forEach(bar => {
                        const randomHeight = Math.floor(Math.random() * 8) + 2;
                        bar.style.height = randomHeight + 'px';
                    });
                    if (audio.duration && isFinite(audio.duration) && !seekDragging) {
                        renderProgress(currentProgressRatio());
                        timeCur.textContent = formatTime(audio.currentTime);
                        timeTotal.textContent = " / " + formatTime(audio.duration);
                    }
                } else {
                    visBars.forEach(bar => { bar.style.height = '2px'; });
                }
            }, 150);

            // Przewijanie: w trakcie przeciągania tylko podgląd, przeskok po puszczeniu
            bindSegDrag(progressContainer, function(ratio, final, isStart) {
                if (isMobileLayout()) return; // na telefonie przewijanie jest wyłączone
                seekDragging = !final;
                renderProgress(ratio);
                // skok przy samym dotknięciu (tap) oraz po puszczeniu palca; w trakcie przeciągania tylko podgląd
                if ((final || isStart) && audio.duration && isFinite(audio.duration)) {
                    audio.currentTime = ratio * audio.duration;
                    timeCur.textContent = formatTime(ratio * audio.duration);
                }
            });

            // Głośność
            bindSegDrag(volumeBar, function(ratio) {
                if (ratio === null) return;
                // zaokrąglenie do pełnych segmentów: to co widać = to co słychać (skrajnie w lewo = mute)
                const segCount = Math.max(1, Math.round((volumeBar.clientWidth + 1) / SEG));
                targetVolume = Math.round(ratio * segCount) / segCount;
                clearInterval(fadeInterval); // użytkownik przejmuje kontrolę nad głośnością
                setVolume(targetVolume);
                renderVolume();
            });

            // Obsługa klawiatury (strzałki)
            volumeBar.addEventListener('keydown', function(e) {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                targetVolume = clamp01(targetVolume + (e.key === 'ArrowRight' ? 0.05 : -0.05));
                clearInterval(fadeInterval);
                setVolume(targetVolume);
                renderVolume();
                e.preventDefault();
            });
            progressContainer.addEventListener('keydown', function(e) {
                if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || !audio.duration || isMobileLayout()) return;
                audio.currentTime = Math.min(Math.max(audio.currentTime + (e.key === 'ArrowRight' ? 5 : -5), 0), audio.duration);
                e.preventDefault();
            });

            renderVolume();
            renderProgress(0);
            window.addEventListener('resize', function() {
                renderVolume();
                renderProgress(seekDragging ? 0 : currentProgressRatio());
            });

            const track = document.getElementById('carouselTrack');
            let maxToCheck = 15;

            for (let i = 1; i <= maxToCheck; i++) {
                const imgPath = `ls-gallery/${i}.jpg`;
                const img = new Image();
                
                img.onload = function() {
                    galleryImagesLoaded.push({ index: i, path: imgPath });
                    galleryImagesLoaded.sort((a, b) => a.index - b.index);
                    renderGallery();
                };
                img.onerror = function() {};
                img.src = imgPath;
            }

            function renderGallery() {
                track.innerHTML = '';
                galleryImagesLoaded.forEach((item, idx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'carousel-item';
                    if (idx === currentIndex) itemDiv.classList.add('active');
                    itemDiv.innerHTML = `<img src="${item.path}" alt="Galeria" onclick="openLightbox('${item.path}')">`;
                    track.appendChild(itemDiv);
                });
                updateGalleryActiveState();
            }

            loadAndRandomizeBlinkies();
            initOrganicButtonParallax();
        });

        function initOrganicButtonParallax() {
            const navBar = document.getElementById('navBar');
            if (!navBar) return;
            const buttons = navBar.querySelectorAll('a');
            if (buttons.length === 0) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            window.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            const buttonConfigs = [
                { rangeX: 7, rangeY: 5, offset: 0 },
                { rangeX: 5, rangeY: 8, offset: 2 },
                { rangeX: 8, rangeY: 6, offset: 4 }
            ];

            function animateButtons() {
                if (window.innerWidth > 768) {
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    const normX = (mouseX - centerX) / centerX;
                    const normY = (mouseY - centerY) / centerY;

                    buttons.forEach((btn, index) => {
                        const cfg = buttonConfigs[index] || buttonConfigs[0];
                        const time = Date.now() * 0.001;
                        const floatX = Math.sin(time * 1.5 + cfg.offset) * 2;
                        const floatY = Math.cos(time * 1.2 + cfg.offset) * 2.5;

                        const moveX = (normX * cfg.rangeX) + floatX;
                        const moveY = (normY * cfg.rangeY) + floatY;

                        btn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });
                } else {
                    buttons.forEach(btn => {
                        btn.style.transform = '';
                    });
                }
                requestAnimationFrame(animateButtons);
            }
            requestAnimationFrame(animateButtons);
        }

        function loadAndRandomizeBlinkies() {
            const blinkiesContainer = document.getElementById('microBannersSection');
            if (!blinkiesContainer) return;

            const baseNames = [];
            for (let n = 1; n <= 50; n++) {
                baseNames.push(`ls-blinkies/banner${n}`);
            }

            const extensions = ['.gif', '.png', '.jpg'];
            const isMobile = window.innerWidth <= 768;
            const limitCount = isMobile ? 10 : 15;

            let shuffledBases = [...baseNames];
            for (let j = shuffledBases.length - 1; j > 0; j--) {
                const r = Math.floor(Math.random() * (j + 1));
                [shuffledBases[j], shuffledBases[r]] = [shuffledBases[r], shuffledBases[j]];
            }

            blinkiesContainer.innerHTML = '';
            let loadedCount = 0;
            let indexToTry = 0;

            function tryFetchNext() {
                if (loadedCount >= limitCount || indexToTry >= shuffledBases.length) return;

                const currentBasePath = shuffledBases[indexToTry];
                indexToTry++;

                let extIndex = 0;

                function testExtension() {
                    if (extIndex >= extensions.length) {
                        tryFetchNext();
                        return;
                    }

                    const testPath = currentBasePath + extensions[extIndex];
                    extIndex++;

                    const testImg = new Image();
                    testImg.src = testPath;

                    testImg.onload = function() {
                        const bannerDiv = document.createElement('div');
                        bannerDiv.className = 'micro-banner-item';
                        bannerDiv.innerHTML = `<img src="${testPath}" alt="">`;
                        blinkiesContainer.appendChild(bannerDiv);

                        loadedCount++;
                        tryFetchNext();
                    };

                    testImg.onerror = function() {
                        testExtension();
                    };
                }
                testExtension();
            }
            tryFetchNext();
        }

        function updateGalleryActiveState() {
            const track = document.getElementById('carouselTrack');
            const items = track.querySelectorAll('.carousel-item');
            if (items.length === 0) return;

            items.forEach((item) => { item.className = 'carousel-item'; });

            if (items[currentIndex]) {
                items[currentIndex].classList.add('active');

                const prevIndex = (currentIndex - 1 + galleryImagesLoaded.length) % galleryImagesLoaded.length;
                if (items[prevIndex]) items[prevIndex].classList.add('prev-item');

                const nextIndex = (currentIndex + 1) % galleryImagesLoaded.length;
                if (items[nextIndex]) items[nextIndex].classList.add('next-item');
            }
        }

        function scrollGallery(direction) {
            if (galleryImagesLoaded.length === 0) return;
            currentIndex = (currentIndex + direction + galleryImagesLoaded.length) % galleryImagesLoaded.length;
            updateGalleryActiveState();
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
