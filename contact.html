<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com | CONTACT</title>
    <link rel="stylesheet" href="style.css">
    <script src="site.js" defer></script>
</head>
<body data-topbar="off">

    <!-- ===== GÓRNY PASEK (widoczny tylko na stronie głównej; reguluje to atrybut data-topbar w #pageContent) ===== -->
    <div class="topbar-wrap" id="topbar" role="status" aria-label="Site information">
        <div class="tb-scroll">
            <div class="tb-row" id="tbRow">
                <span class="tb-item tb-time"><span>it's</span><span class="tb-val"><span id="tbHH">--</span><span class="tb-colon">:</span><span id="tbMM">--</span></span><span>in Warsaw, Poland</span></span>
                <span class="tb-item tb-moon"><span id="tbMoonIcon"></span><span class="tb-moon-text" id="tbMoonText">moon</span></span>
                <span class="tb-item tb-visits" id="tbVisits"><span>thanks for visiting me</span><a href="https://www.counter12.com" target="_blank" rel="noopener"><img id="tbCounterImg" alt="visitor counter"></a><span>times.</span></span>
                <span class="tb-motto" id="tbMotto"><span class="tb-motto-inner" id="tbMottoInner"></span></span>
            </div>
        </div>
    </div>

    <!-- Ukryty odtwarzacz audio (zapasowy; główne odtwarzanie idzie przez Web Audio) -->
    <audio id="bgAudio" src="audio/track.mp3" loop></audio>
    <div class="side-banners-left"></div>

    <div class="main-container">
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.gif" alt="Lost Section Banner">
            </a>
        </div>

        <div class="nav-bar" id="navBar">
            <a href="about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
            <a href="/shop">
                <img src="images/button_shop_ls.png" alt="Shop">
            </a>
            <a href="/contact">
                <img src="images/button_contact_ls.png" alt="Contact">
            </a>
        </div>

        <div class="margin-box"></div>

        <!-- ===== PLAYER (zostaje na miejscu podczas przechodzenia między podstronami) ===== -->
        <section class="ls-player is-idle" id="lsPlayer" aria-label="Music player">
            <div class="lp-titlebar" aria-hidden="true">
                <span class="lp-grip"></span>
                <span class="lp-title">LOST SECTION AUDIO</span>
                <span class="lp-grip"></span>
            </div>
            <div class="lp-body">
                <div class="lp-display">
                    <div class="lp-time">
                        <span class="lp-state" id="lpState"></span>
                        <div class="lp-digits" id="lpDigits" role="timer" aria-label="Elapsed time"></div>
                        <span class="lp-total" id="lpTotal">TOT --:--</span>
                    </div>
                    <div class="lp-info">
                        <div class="lp-marquee"><span class="lp-marquee-text" id="lpTitleText">宇多田ヒカル【First Love】03 In my room</span></div>
                        <div class="lp-meta"><span><b id="lpKbps">---</b> KBPS</span><span><b id="lpKhz">--</b> KHZ</span><b id="lpCh">---</b></div>
                    </div>
                    <canvas class="lp-spectrum" id="lpSpectrum" aria-hidden="true"></canvas>
                </div>
                <div class="lp-controls">
                    <div class="lp-btns">
                        <button class="lp-btn" id="lpPlay" type="button" aria-label="Play"></button>
                        <button class="lp-btn" id="lpPause" type="button" aria-label="Pause"></button>
                        <button class="lp-btn" id="lpStop" type="button" aria-label="Stop"></button>
                    </div>
                    <div class="lp-leds" aria-hidden="true">
                        <span class="lp-led lp-led-play"><i></i>PLAY</span>
                        <span class="lp-led lp-led-load"><i></i>LOAD</span>
                        <span class="lp-led lp-led-loop"><i></i>LOOP</span>
                    </div>
                    <div class="seg-bar lp-seek" id="progressContainer" role="slider" tabindex="0" aria-label="Przewijanie utworu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="seg-fill" id="progressBar"></div>
                    </div>
                    <div class="lp-vol">
                        <span>VOL</span>
                        <div class="seg-bar" id="volumeBar" role="slider" tabindex="0" aria-label="Głośność" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
                            <div class="seg-fill" id="volumeFill"></div>
                        </div>
                        <span id="lpVolNum">15</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== TREŚĆ STRONY (tylko ten blok jest podmieniany przy przechodzeniu między podstronami) ===== -->
        <main id="pageContent" data-topbar="off">
            <!-- ============ IN PROGRESS ============
                 Ten blok zastępuje niedokończone sekcje strony. Nazwa sekcji w nawiasie bierze się
                 automatycznie z nazwy pliku (contact.html -> CONTACT). Możesz ją też wpisać ręcznie
                 w atrybucie data-section, np. data-section="Shop". -->
            <div class="in-progress" id="inProgress" data-section="">
                <div class="ip-frame">
                    <span class="ip-corner tl"></span>
                    <span class="ip-corner tr"></span>
                    <span class="ip-corner bl"></span>
                    <span class="ip-corner br"></span>

                    <div class="ip-label">[ SECTION: <span id="ipSection">CONTACT</span> ]<span class="ip-jp">工事中</span></div>
                    <div class="ip-title" data-text="IN PROGRESS">IN PROGRESS</div>
                    <div class="ip-bar" aria-hidden="true"><div class="ip-bar-fill"></div></div>
                    <div class="ip-sub">UNDER CONSTRUCTION<span class="ip-cursor">_</span></div>
                </div>
            </div>
        </main>

        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>
    </div>
</body>
</html>
