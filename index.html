<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost-section.com</title>
    <link rel="stylesheet" href="style.css">
    <script src="site.js" defer></script>
</head>
<body data-topbar="on">

    <!-- ===== GÓRNY PASEK (widoczny tylko tam, gdzie #pageContent ma data-topbar="on") ===== -->
    <div class="topbar-wrap" id="topbar" role="status" aria-label="Site information">
        <div class="tb-scroll">
            <div class="tb-fixed">
                <div class="tb-box tb-brand">LOST-SECTION</div>
                <div class="tb-box tb-time"><span>It's currently</span><span class="tb-val"><span id="tbHH">--</span><span class="tb-colon">:</span><span id="tbMM">--</span></span><span>in Warsaw, Poland.</span></div>
            </div>
            <div class="tb-ticker">
              <div class="tb-row" id="tbRow">
                <div class="tb-loop-set">
                    <div class="tb-box tb-moon"><span id="tbMoonIcon"></span><span class="tb-moon-text" id="tbMoonText">moon</span></div>
                    <div class="tb-box tb-visits" id="tbVisits"><span>Thank you for visiting me</span><a href="https://www.counter12.com" target="_blank" rel="noopener"><img id="tbCounterImg" alt="visitor counter"></a><span>times.</span></div>
                    <div class="tb-box tb-motto-box"><span class="tb-label">MOTTO</span><span class="tb-motto" id="tbMotto"><span class="tb-motto-inner" id="tbMottoInner"></span></span></div>
                </div>
              </div>
            </div>
        </div>
    </div>

    <!-- Ukryty odtwarzacz audio (zapasowy; główne odtwarzanie idzie przez Web Audio) -->
    <audio id="bgAudio" src="audio/track.mp3" loop></audio>
    <div class="side-banners-left"></div>

    <div class="main-container">
        <div class="banner-gora">
            <a href="https://www.lost-section.com/">
                <img src="images/ls_banner_gora.gif" alt="Lost Section Banner">
            </a>
        </div>

        <div class="nav-bar" id="navBar">
            <a href="about.html">
                <img src="images/button_about_ls.png" alt="About">
            </a>
            <a href="archive.html">
                <img src="images/button_archive_ls.png" alt="Archive">
            </a>
            <a href="/shop">
                <img src="images/button_shop_ls.png" alt="Shop">
            </a>
            <a href="/contact">
                <img src="images/button_contact_ls.png" alt="Contact">
            </a>
        </div>

        <div class="margin-box"></div>

        <!-- ===== TREŚĆ STRONY (tylko ten blok jest podmieniany przy przechodzeniu między podstronami) ===== -->
        <main id="pageContent" data-topbar="on">
            <div class="main-design">
                <img src="images/ls_design_main.gif" alt="Main Design">
            </div>

            <!-- ===== PLAYER + GALERIA: dwa zadokowane okna w stylu Winampa ===== -->
            <div class="ls-deck">

                <section class="ls-player is-idle" id="lsPlayer" aria-label="Music player">
                    <div class="lp-titlebar" aria-hidden="true">
                        <span class="lp-grip"></span>
                        <span class="lp-title">LOST RADIO</span>
                        <span class="lp-grip"></span>
                    </div>
                    <div class="lp-body">
                        <div class="lp-display">
                            <div class="lp-time">
                                <span class="lp-state" id="lpState"></span>
                                <div class="lp-digits" id="lpDigits" role="timer" aria-label="Elapsed time"></div>
                                <span class="lp-total" id="lpTotal">TOT --:--</span>
                            </div>
                            <div class="lp-info">
                                <div class="lp-marquee">
                                    <div class="lp-marquee-track">
                                        <span class="lp-marquee-text" id="lpTitleText">宇多田ヒカル【First Love】03 In my room</span>
                                        <span class="lp-marquee-text lp-marquee-copy" aria-hidden="true">宇多田ヒカル【First Love】03 In my room</span>
                                    </div>
                                </div>
                                <div class="lp-meta"><span><b id="lpKbps">---</b> KBPS</span><span><b id="lpKhz">--</b> KHZ</span><b id="lpCh">---</b></div>
                            </div>
                            <canvas class="lp-spectrum" id="lpSpectrum" aria-hidden="true"></canvas>
                        </div>
                        <div class="lp-controls">
                            <div class="lp-btns">
                                <button class="lp-btn" id="lpPlay" type="button" aria-label="Play"></button>
                                <button class="lp-btn" id="lpPause" type="button" aria-label="Pause"></button>
                                <button class="lp-btn" id="lpStop" type="button" aria-label="Stop"></button>
                            </div>
                            <div class="lp-leds" aria-hidden="true">
                                <span class="lp-led lp-led-play"><i></i>PLAY</span>
                                <span class="lp-led lp-led-load"><i></i>LOAD</span>
                                <span class="lp-led lp-led-loop"><i></i>LOOP</span>
                            </div>
                            <div class="seg-bar lp-seek" id="progressContainer" role="slider" tabindex="0" aria-label="Przewijanie utworu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                                <div class="seg-fill" id="progressBar"></div>
                            </div>
                            <div class="lp-vol">
                                <span>VOL</span>
                                <div class="seg-bar" id="volumeBar" role="slider" tabindex="0" aria-label="Głośność" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
                                    <div class="seg-fill" id="volumeFill"></div>
                                </div>
                                <span id="lpVolNum">15</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Galeria: zdjęcia wystarczy wrzucić do folderu ls-gallery (dowolne nazwy, dowolna liczba) -->
                <section class="ls-gallery" id="lsGallery" aria-label="Photo gallery">
                    <div class="lp-titlebar" aria-hidden="true">
                        <span class="lp-grip"></span>
                        <span class="lp-title">LOST PICTURES</span>
                        <span class="lp-grip"></span>
                    </div>
                    <div class="lg-body">
                        <div class="lg-screen" id="lgScreen" tabindex="0" role="region" aria-label="Photo carousel">
                            <div class="lg-track" id="lgTrack"></div>
                            <div class="lg-empty" id="lgEmpty">LOADING PHOTOS...</div>
                        </div>
                        <div class="lg-controls">
                            <div class="lp-btns">
                                <button class="lp-btn" id="lgPrev" type="button" aria-label="Previous photo"></button>
                                <button class="lp-btn" id="lgNext" type="button" aria-label="Next photo"></button>
                                <button class="lp-btn lg-auto" id="lgAuto" type="button" aria-label="Autoplay">AUTO</button>
                            </div>
                            <div class="lg-counter">
                                <div class="lg-digits" id="lgDigits"></div>
                                <span class="lg-total" id="lgTotal">/ 00</span>
                            </div>
                            <div class="lg-file" id="lgFile">---</div>
                        </div>
                        <div class="lg-playlist" id="lgPlaylist" aria-label="Photo list"></div>
                    </div>
                </section>

            </div>

            <div class="micro-banners-section" id="microBannersSection"></div>

            <div id="lightbox" onclick="closeLightbox()">
                <img id="lightbox-img" src="" alt="Full size">
            </div>
        </main>

        <div class="ls-partners">
            <img src="images/ls_partners.jpg" alt="Partners">
        </div>

        <div class="ls-dol">
            <img src="images/ls_dol.jpg" alt="Stopka">
        </div>
    </div>
</body>
</html>
